-- Conky Configuration for Lenovo ThinkPad L440
-- Zorin OS / XFCE
-- Theme: Matrix Terminal Cyberpunk HUD
-- Font: JetBrains Mono / TrueType Monospace

local home = os.getenv("HOME") or "/home/pedro-wilson"
local colors_file = home .. '/.config/conky/colors.lua'
local theme = {}
local file = io.open(colors_file, 'r')
if file ~= nil then
    file:close()
    theme = dofile(colors_file)
else
    theme = {
        own_window_colour = '020702',
        own_window_argb_value = 220,
        default_color = '#00FF41',
        color1 = '00FF41',             -- Verde Matrix Neon
        color2 = 'E6FFE6',             -- Branco-Verde Digital (Legibilidade Máxima)
        color3 = '00CC44',             -- Verde Terminal Fosforescente (Rótulos)
        color4 = '003B14',             -- Linhas de Grade Matrix
        color5 = '39FF14',             -- Verde Lima Cibernético (Gráficos)
        color6 = 'FF3344',             -- Glitch Red Alerta
        down_graph_fade = '002B0E',
        up_graph_fade = '00240B',
    }
end

conky.config = {
    -- Window & Placement (Ajustado para ThinkPad L440 sem sobreposição)
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 16,
    minimum_width = 390,
    maximum_width = 390,
    border_inner_margin = 12,
    border_outer_margin = 0,

    -- X11 / Xfwm4 Desktop Integration & Terminal Matrix Translúcido
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = theme.own_window_argb_value,
    own_window_colour = theme.own_window_colour,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'Conky',

    -- Double Buffering & Smooth Updates
    double_buffer = true,
    no_buffers = true,
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Typography & Fonts (JetBrains Mono / Hack Monospace)
    use_xft = true,
    override_utf8_locale = true,
    font = 'JetBrains Mono:size=10',
    xftalpha = 1.0,
    uppercase = false,

    -- Visual Elements
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    show_graph_scale = false,
    show_graph_range = false,

    -- Matrix HUD Palette
    default_color = theme.default_color,
    default_shade_color = '#000000',
    default_outline_color = '#000000',

    color1 = theme.color1,             -- Destaque Principal / HUD
    color2 = theme.color2,             -- Valores / Leitura rápida
    color3 = theme.color3,             -- Rótulos / Descrições
    color4 = theme.color4,             -- Grade / Linhas sutis
    color5 = theme.color5,             -- Destaque secundário (gráficos / upload)
    color6 = theme.color6,             -- Alertas e avisos
}

local template_text = [[
${color1}SYS.MONITOR // THINKPAD L440 [MATRIX_NET] ${color4}${hr 1}
${alignc}${font JetBrains Mono:weight=Bold:size=30}${color2}${time %H:%M}${font JetBrains Mono:size=13}${color1}:${time %S}${font}
${alignc}${font JetBrains Mono:weight=Bold:size=9}${color1}${exec date +"%A" | tr '[:lower:]' '[:upper:]'}${color4}  //  ${color2}${time %d %b %Y}${font}
${color1}┌── PROCESSADOR (CPU) ${color4}${hr 1}
${color3}│ Modelo : ${color2}Intel Core i5-4300M @ 2.60GHz
${color3}│ Freq   : ${color1}${freq_g} GHz ${color3}│ Total: ${color2}${cpu cpu0}% ${color3}│ Pkg: ${color1}${hwmon coretemp temp 1}°C
${color3}│ Núcleos: ${color3}C0: ${color2}${hwmon coretemp temp 2}°C ${color3}│ C1: ${color2}${hwmon coretemp temp 3}°C
${color3}│ Barra  : ${color1}${cpubar cpu0 4,295}
${color1}┌── MEMÓRIA RAM & SWAP ${color4}${hr 1}
${color3}│ RAM    : ${color2}${mem} / ${memmax} (${color1}${memperc}%${color3}) ${alignr}${color3}Livre: ${color2}${memeasyfree}
${color3}│ Barra  : ${color1}${membar 4,295}
${color3}│ SWAP   : ${color2}${swap} / ${swapmax} (${color2}${swapperc}%${color3}) ${alignr}${color4}${swapbar 4,140}
${color1}┌── GRÁFICOS (GPU) ${color4}${hr 1}
${color3}│ GPU    : ${color2}Intel HD Graphics 4600 ${color3}(i915)
${color3}│ Freq   : ${color1}${exec __HOME__/.config/conky/scripts/gpu_info.sh freq}${color3} / 1250 MHz ${alignr}${color3}Temp: ${color1}${hwmon coretemp temp 1}°C
${color3}│ Carga  : ${color3}N/D (Sem sensor não-root)
${color1}┌── ARMAZENAMENTO (SSD/HDD) ${color4}${hr 1}
${color3}│ Raiz (/): ${color2}${fs_used /} / ${fs_size /} (${color1}${fs_used_perc /}%${color3})
${color3}│ Livre   : ${color2}${fs_free /} ${alignr}${color1}${fs_bar 4,180 /}
${color1}┌── REDE & INTERNET ${color4}${hr 1}
${if_existing /sys/class/net/enp0s25/operstate up}${color3}│ Interface: ${color2}enp0s25 ${color1}(Ethernet 1Gbps)
${color3}│ Down: ${color2}${downspeed enp0s25}/s ${alignr}${color3}Up: ${color2}${upspeed enp0s25}/s
${color3}│ Total: ${color2}${totaldown enp0s25} ${alignr}${color3}Total: ${color2}${totalup enp0s25}
${color1}${downspeedgraph enp0s25 12,175 __C1__ __DOWN_FADE__ -l} ${alignr}${color5}${upspeedgraph enp0s25 12,175 __C5__ __UP_FADE__ -l}
${else}${if_existing /sys/class/net/wlp2s0/operstate up}${color3}│ Interface: ${color2}wlp2s0 ${color1}(Wi-Fi) ${alignr}${color3}Sinal: ${color2}${wireless_link_qual_perc wlp2s0}% ${color4}${wireless_link_bar 4,50 wlp2s0}
${color3}│ Down: ${color2}${downspeed wlp2s0}/s ${alignr}${color3}Up: ${color2}${upspeed wlp2s0}/s
${color3}│ Total: ${color2}${totaldown wlp2s0} ${alignr}${color3}Total: ${color2}${totalup wlp2s0}
${color1}${downspeedgraph wlp2s0 12,175 __C1__ __DOWN_FADE__ -l} ${alignr}${color5}${upspeedgraph wlp2s0 12,175 __C5__ __UP_FADE__ -l}
${else}${color3}│ Interface: ${color6}Nenhuma ativa
${color3}│ Status   : ${color6}Desconectado / Offline
${endif}${endif}
${color1}┌── TOP PROCESSOS ${color4}${hr 1}
${color3}│ CPU 1: ${color2}${top name 1} ${goto 210}${color3}PID: ${color2}${top pid 1} ${alignr}${color1}${top cpu 1}%
${color3}│ CPU 2: ${color2}${top name 2} ${goto 210}${color3}PID: ${color2}${top pid 2} ${alignr}${color1}${top cpu 2}%
${color3}│ CPU 3: ${color2}${top name 3} ${goto 210}${color3}PID: ${color2}${top pid 3} ${alignr}${color1}${top cpu 3}%
${color3}│ MEM 1: ${color2}${top_mem name 1} ${goto 210}${color3}PID: ${color2}${top_mem pid 1} ${alignr}${color2}${top_mem mem_res 1}
${color3}│ MEM 2: ${color2}${top_mem name 2} ${goto 210}${color3}PID: ${color2}${top_mem pid 2} ${alignr}${color2}${top_mem mem_res 2}
${color3}│ MEM 3: ${color2}${top_mem name 3} ${goto 210}${color3}PID: ${color2}${top_mem pid 3} ${alignr}${color2}${top_mem mem_res 3}
${color1}┌── SISTEMA ${color4}${hr 1}
${color3}│ SO     : ${color2}Zorin OS 18.1 x86_64
${color3}│ Kernel : ${color2}${kernel}
${color3}│ Host   : ${color2}${nodename}
${color3}│ Uptime : ${color2}${uptime}
${color4}${hr 1}
]]

conky.text = template_text:gsub('__HOME__', home)
                          :gsub('__C1__', theme.color1)
                          :gsub('__C5__', theme.color5)
                          :gsub('__DOWN_FADE__', theme.down_graph_fade)
                          :gsub('__UP_FADE__', theme.up_graph_fade)
